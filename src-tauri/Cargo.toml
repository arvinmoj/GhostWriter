[package]
name = "ghostwriter"
version = "0.12.0"
edition = "2021"
description = "Universal AI Text Refiner - System-wide text transformation"
authors = ["Arvin Moj"]
license = "MIT"

[lib]
name = "ghostwriter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks"] }
arboard = "3"
enigo = "0.3"
dirs = "5"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
base64 = "0.22"
hostname = "0.4"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
